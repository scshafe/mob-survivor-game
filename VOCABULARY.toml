# Project vocabulary: the central concepts of this project, defined once so they can be
# referenced without ambiguity. Refer to a term as `<project-id>:<slug>` (project-id is
# dev.toml [project] id). Add one with `dev vocab add`; `dev check` (BASE-09) validates this file.
schema = 1

# [[term]]
# slug = "managed-section"                  # lowercase words joined by `-`; at most 48 chars; unique
# title = "Managed section"                 # one line
# definition = """
# Plain text; may span lines. Say what the concept is and what it is not.
# """
# refs = ["docs/design.md#managed-section"] # optional: repo-relative paths, #anchor optional; must exist
# aliases = ["marker block"]                # optional: search words (not slugs, never another term's slug)

[[term]]
slug = "mob"
title = "Mob"
definition = """
One marching unit on the field: a grunt, runner, giant or brute of one team. A mob
with more than one hit point is a squad and stands for that many grunts. Not a
player: players own cannons, and the AI owns the enemy waves in a campaign.
"""
refs = ["include/mob_survivor/world.hpp", "docs/design.md"]
aliases = ["unit", "squad", "grunt"]

[[term]]
slug = "gate"
title = "Gate"
definition = """
A bar across the lane that changes each mob of the teams it serves once, as it
crosses: multiply (xN), add (+N) or halve (/2), or change what mobs are: fuse
them into giants, make them runners, or armor them. Gates may slide; a gate
serving both teams is drawn with a purple edge.
"""
refs = ["include/mob_survivor/level.hpp", "docs/design.md"]
aliases = ["multiplier"]

[[term]]
slug = "match"
title = "Match"
definition = """
One game in a room from start to game over: a campaign (levels until the
players' base falls, with upgrade cards between levels) or one versus round.
Deterministic, like the world it runs. Not a level: a campaign match has many.
"""
refs = ["include/mob_survivor/match.hpp"]
aliases = ["game", "round"]

[[term]]
slug = "room"
title = "Room"
definition = """
A group of players behind a four-letter code, with a host, seats (at most four)
and watchers; it runs one match at a time and returns to its lobby afterwards.
Public rooms are listed on the home screen.
"""
refs = ["src/net/lobby.hpp", "docs/protocol.md"]
aliases = ["lobby", "code"]

[[term]]
slug = "snapshot"
title = "Snapshot"
definition = """
The binary message the server sends 15 times a second with everything that moves:
cannons, gate and saw positions, bombs, events and every mob. The client
interpolates between two of them. Static level data travels once, as JSON.
"""
refs = ["docs/protocol.md", "src/net/protocol.cpp", "web/js/snapshot.js"]
aliases = ["state update"]

[[term]]
slug = "upgrade-card"
title = "Upgrade card"
definition = """
A per-player power-up chosen between campaign levels, one of three offered at
random (rapid fire, twin barrel, fortify, ...). Some stack up to a limit.
"""
refs = ["include/mob_survivor/upgrades.hpp", "docs/design.md"]
aliases = ["card", "perk"]

[[term]]
slug = "frenzy"
title = "Frenzy"
definition = """
The versus overtime from 2:30: every gate gets stronger (xN gives one more, +N
half again) until the 4:00 time limit, when the healthier base wins.
"""
refs = ["docs/design.md"]
aliases = ["overtime"]

[[term]]
slug = "power-up"
title = "Power-up"
definition = """
An orb that drifts across the lane during a level. A player's grunts and
runners that run into it are spent on it, one hit point for one; the player
whose mob breaks it gets its effect: +1 shot (one more mob every volley for the
rest of the level), freeze, flip, shield or magnet. Not an upgrade card: cards
are picked between campaign levels and last the whole run.
"""
refs = ["include/mob_survivor/world.hpp", "docs/design.md"]
aliases = ["+1 shot", "orb", "freeze", "shield", "magnet"]

[[term]]
slug = "layout"
title = "Layout"
definition = """
The named shape of a level's lane: open, hourglass (walls pinch the middle),
twin lanes (a centre wall splits it), conveyor (belts carry mobs sideways) or
teleporters (pads swap mobs across). Rolled per campaign level from level 3 and
per versus arena; point-symmetric in versus. Not the gates: gates are laid out
in rows on top of any layout.
"""
refs = ["include/mob_survivor/level.hpp", "docs/design.md"]
aliases = ["map", "arena", "hourglass", "twin lanes", "conveyor", "teleporter"]

[[term]]
slug = "daily-challenge"
title = "Daily challenge"
definition = """
A solo campaign seeded from the UTC date, so everyone plays the same levels that
day. A name's first finished run goes on the day's board; later runs are practice
against a ghost of the day's best run. Not the hall of fame, which ranks ordinary
campaign runs of all time.
"""
refs = ["src/net/daily.hpp", "docs/design.md"]
aliases = ["daily", "daily board", "ghost"]

[[term]]
slug = "replay"
title = "Replay"
definition = """
A recorded match: its mode, seed, seats and every player input with the match
tick it arrived at. Because a match is deterministic, playing the inputs back
gives the same match. Not a video: it is re-simulated, on the server, to watch it.
"""
refs = ["include/mob_survivor/replay.hpp", "src/net/replay_file.hpp", "docs/design.md"]
aliases = ["recording", "input log"]
