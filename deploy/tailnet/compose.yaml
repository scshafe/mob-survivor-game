# Mob Survivor on the tailnet as its own machine, `mob-survivor`, served at
# https://mob-survivor.<your-tailnet>.ts.net (tailnet only; never Funnel).
#
#   cd deploy/tailnet
#   cp .env.example .env        # then put a Tailscale auth key in it
#   docker compose up -d --build
#
# The `tailscale` container joins the tailnet as `mob-survivor` and
# terminates HTTPS with the tailnet's certificate (serve.json); the game shares
# its network namespace and listens only on 127.0.0.1:8080 inside it, so
# nothing is published on the Docker host itself. See docs/deploy-tailnet.md.
name: mob-survivor

services:
  tailscale:
    image: tailscale/tailscale:v1.102.5@sha256:c507f3a2a6ab1cabd8d809b98edeb41edbd5c3fb6ad9632ffd098b4c7d0b4065
    hostname: mob-survivor
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY:?put a Tailscale auth key in deploy/tailnet/.env}
      TS_HOSTNAME: mob-survivor
      TS_STATE_DIR: /var/lib/tailscale
      TS_SERVE_CONFIG: /config/serve.json
      TS_USERSPACE: "true"
      TS_EXTRA_ARGS: ${TS_EXTRA_ARGS:-}
    volumes:
      - tailscale-state:/var/lib/tailscale
      - ./serve.json:/config/serve.json:ro
    restart: unless-stopped

  game:
    build:
      context: ../..
    image: mob-survivor:local
    network_mode: service:tailscale
    depends_on:
      - tailscale
    environment:
      MOB_SURVIVOR_BIND: 127.0.0.1
      MOB_SURVIVOR_PORT: "8080"
    volumes:
      - game-data:/data
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    restart: unless-stopped

volumes:
  tailscale-state:
  game-data:
